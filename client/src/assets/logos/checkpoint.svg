<svg viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Check Point">
  <title>Check Point</title>
  <g transform="translate(10, 4)">
    <!-- Main Magenta Circle Icon -->
    <circle cx="150" cy="34" r="28" fill="#E6007E" />
    
    <!-- Inner White Connected Nodes -->
    <circle cx="158" cy="38" r="7" fill="#FFFFFF" />
    <polygon points="135,22 143,18 147,24 139,28" fill="#FFFFFF" />
    <line x1="140" y1="24" x2="154" y2="34" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Top-Right Floating Black Dot -->
    <circle cx="180" cy="14" r="9" fill="#000000" />
    
    <!-- CHECK Text (Black Bold) -->
    <text
      x="8"
      y="96"
      font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
      font-weight="800"
      font-size="34"
      letter-spacing="1.5"
      fill="#0A0A0A"
    >CHECK</text>
    
    <!-- POINT Text (Magenta Bold) -->
    <text
      x="162"
      y="96"
      font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
      font-weight="800"
      font-size="34"
      letter-spacing="1.5"
      fill="#E6007E"
    >POINT</text>
  </g>
</svg>
