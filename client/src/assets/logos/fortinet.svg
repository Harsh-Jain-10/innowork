<svg viewBox="0 0 260 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fortinet">
  <title>Fortinet</title>
  <!-- Fortinet F-grid icon (official square pattern) -->
  <rect x="8"  y="10" width="13" height="13" fill="#C32026"/>
  <rect x="23" y="10" width="13" height="13" fill="#C32026"/>
  <rect x="8"  y="25" width="13" height="13" fill="#C32026"/>
  <!-- Top-right empty, bottom-right filled -->
  <rect x="23" y="25" width="13" height="13" fill="#C32026"/>
  <!-- Fortinet text -->
  <text x="44" y="39" font-family="'Arial',sans-serif" font-weight="800" font-size="18" fill="#C32026" letter-spacing="1">FORTINET</text>
</svg>