<svg viewBox="0 0 280 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hewlett Packard Enterprise">
  <title>Hewlett Packard Enterprise</title>
  <!-- Top Green Outline Rectangle -->
  <rect
    x="4"
    y="4"
    width="96"
    height="28"
    fill="none"
    stroke="#01A781"
    stroke-width="8"
  />

  <!-- Hewlett Packard Black Text -->
  <text
    x="4"
    y="64"
    font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
    font-weight="800"
    font-size="28"
    letter-spacing="-0.5"
    fill="#000000"
  >Hewlett Packard</text>

  <!-- Enterprise Black Text -->
  <text
    x="4"
    y="94"
    font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
    font-weight="500"
    font-size="28"
    letter-spacing="-0.5"
    fill="#000000"
  >Enterprise</text>
</svg>
