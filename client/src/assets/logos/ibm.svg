<svg viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IBM">
  <title>IBM</title>
  <!-- IBM classic blue block letters with stripe pattern approximation -->
  <g fill="#0530AD">
    <!-- I -->
    <rect x="8"  y="14" width="20" height="4.5"/>
    <rect x="13" y="21" width="10" height="4.5"/>
    <rect x="13" y="28" width="10" height="4.5"/>
    <rect x="8"  y="35" width="20" height="4.5"/>
    <!-- B -->
    <rect x="36" y="14" width="4"  height="26"/>
    <rect x="40" y="14" width="12" height="4.5"/>
    <rect x="52" y="18.5" width="4" height="8"/>
    <rect x="40" y="23.5" width="12" height="4.5"/>
    <rect x="52" y="28" width="4" height="7.5"/>
    <rect x="40" y="35" width="12" height="4.5"/>
    <!-- M -->
    <rect x="64" y="14" width="4"  height="26"/>
    <rect x="88" y="14" width="4"  height="26"/>
    <polygon points="68,14 74,30 78,14" fill="#0530AD"/>
    <polygon points="92,14 86,14 82,30" fill="#0530AD"/>
    <rect x="64" y="35" width="28" height="4.5"/>
  </g>
</svg>