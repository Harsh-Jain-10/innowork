<svg viewBox="4 10 310 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nutanix">
  <title>Nutanix</title>
  <g transform="translate(4, 4)">
    <!-- NUTANI Dark Blue Wordmark -->
    <text
      x="4"
      y="52"
      font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
      font-weight="800"
      font-size="46"
      letter-spacing="0.5"
      fill="#0D5CB6"
    >NUTANI</text>

    <!-- Custom X: Lime Green left diagonal + Dark Blue right diagonal -->
    <g transform="translate(232, 10)">
      <!-- Lime Green Left-to-Right Slash -->
      <path d="M 4 4 L 32 40" stroke="#8DC63F" stroke-width="11" stroke-linecap="round" />
      <!-- Dark Blue Right-to-Left Slash -->
      <path d="M 32 4 L 4 40" stroke="#0D5CB6" stroke-width="11" stroke-linecap="round" />
    </g>
  </g>
</svg>