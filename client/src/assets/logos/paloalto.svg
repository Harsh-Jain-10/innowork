<svg viewBox="0 0 380 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Palo Alto Networks">
  <title>Palo Alto Networks</title>
  <g transform="translate(6, 6)">
    <!-- Orange Interlocking Diamond Mark -->
    <g fill="#FA461E">
      <!-- Upper diagonal bar -->
      <polygon points="30,2 54,2 84,32 60,32" />
      <!-- Lower diagonal bar -->
      <polygon points="2,30 26,30 56,60 32,60" />
      <!-- Top-right interlocking block -->
      <polygon points="44,16 68,16 84,32 60,32" />
      <!-- Bottom-left interlocking block -->
      <polygon points="2,30 26,30 42,46 18,46" />
    </g>

    <!-- Wordmark "paloalto" in lowercase black -->
    <text
      x="96"
      y="50"
      font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
      font-weight="800"
      font-size="52"
      letter-spacing="-1.5"
      fill="#000000"
    >paloalto</text>

    <!-- Sub-wordmark "NETWORKS" in tracked black -->
    <text
      x="226"
      y="72"
      font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
      font-weight="800"
      font-size="17"
      letter-spacing="5"
      fill="#000000"
    >NETWORKS</text>
  </g>
</svg>