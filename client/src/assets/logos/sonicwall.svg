<svg viewBox="0 0 310 75" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SonicWall">
  <title>SonicWall</title>

  <g transform="translate(4, 4)">
    <!-- "SONIC" — medium weight, slate grey -->
    <text
      x="0"
      y="50"
      font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
      font-weight="400"
      font-size="44"
      letter-spacing="1"
      fill="#5F6062"
    >SONIC</text>

    <!-- "WALL" — bold, dark charcoal -->
    <text
      x="146"
      y="50"
      font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
      font-weight="800"
      font-size="44"
      letter-spacing="1"
      fill="#4A4D52"
    >WALL</text>

    <!-- Orange swoosh crescent intersecting the W and A of WALL -->
    <path
      d="M 178 64
         C 192 50 216 35 246 35
         C 218 37 194 45 178 55
         C 172 59 174 63 178 64 Z"
      fill="#F05A22"
    />
  </g>
</svg>