<svg viewBox="0 0 360 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Symantec">
  <title>Symantec</title>
  <g transform="translate(6, 6)">
    <!-- Yellow Ring Icon -->
    <circle cx="38" cy="38" r="32" fill="none" stroke="#FFB300" stroke-width="12" />
    
    <!-- Black Checkmark -->
    <path
      d="M 22 38 L 34 50 L 64 16"
      fill="none"
      stroke="#000000"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    
    <!-- Pixelated Tail Accents on Top-Right of Checkmark -->
    <rect x="62" y="10" width="4" height="4" fill="#000000" />
    <rect x="68" y="4" width="4" height="4" fill="#000000" />
    <rect x="74" y="0" width="4" height="4" fill="#FFB300" />

    <!-- Bold Black Symantec Wordmark -->
    <text
      x="96"
      y="54"
      font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
      font-weight="800"
      font-size="52"
      letter-spacing="-1"
      fill="#000000"
    >Symantec</text>
  </g>
</svg>